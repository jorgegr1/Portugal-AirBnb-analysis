[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egd_airbnb"
version = "0.1.0"
description = "FEUP/MECD EGD project: Spark pipeline over Inside Airbnb data (Porto, Lisbon, Madrid, Barcelona)."
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "folium>=0.15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.32",
    "pydeck>=0.8",
    "altair>=5.2",
]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ruff>=0.4",
    "pytest>=8.0",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
